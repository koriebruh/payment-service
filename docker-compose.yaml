services:
  payment-service:
    container_name: payment-service-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Override host variables for Docker networking
      - DB_HOST=payment-service-postgres
      - KAFKA_BROKERS=payment-service-kafka:9092
      - REDIS_HOST=payment-service-redis
      - OTEL_ENDPOINT=payment-service-alloy:4317
      - LOG_FILE_PATH=/app/logs/payment-service.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - payment-network

  postgres:
    container_name: payment-service-postgres
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  redis:
    container_name: payment-service-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - payment-network

  zookeeper:
    container_name: payment-service-zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeperdata:/var/lib/zookeeper/data
      - zookeeperlog:/var/lib/zookeeper/log
    networks:
      - payment-network

  kafka:
    container_name: payment-service-kafka
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: payment-service-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://payment-service-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - payment-network

  alloy:
    container_name: payment-service-alloy
    image: grafana/alloy:v1.6.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./config/alloy-config.alloy:/etc/alloy/config.alloy
      - ./logs:/var/log/app
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "12345:12345" # Alloy UI
    networks:
      - payment-network
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    container_name: payment-service-tempo
    image: grafana/tempo:2.8.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP
    networks:
      - payment-network

  loki:
    container_name: payment-service-loki
    image: grafana/loki:3.3.0
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - payment-network

  prometheus:
    container_name: payment-service-prometheus
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-otlp-receiver"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - payment-network
    depends_on:
      - payment-service

  grafana:
    container_name: payment-service-grafana
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - payment-network
    depends_on:
      - prometheus
      - tempo
      - loki

  postgres-exporter:
    container_name: payment-service-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@payment-service-postgres:5432/${DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - payment-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  zookeeperdata:
  zookeeperlog:
  kafkadata:
  prometheusdata:
  grafanadata:

networks:
  payment-network:
    driver: bridge
